---
# ===================================================================
# Deploy shared MLflow tracking server via community Helm chart
# with OpenShift OAuth proxy sidecar for SSO
# ===================================================================

# -------------------------------------------------------------------
# 1. Create namespace
# -------------------------------------------------------------------
- name: Create MLflow namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp4_workload_mlflow_cluster_namespace }}"

# -------------------------------------------------------------------
# 2. Pre-create service accounts for SCC binding
# -------------------------------------------------------------------
- name: Pre-create MLflow service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: mlflow
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: "{{ ocp4_workload_mlflow_cluster_release_name }}"
          meta.helm.sh/release-namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
          serviceaccounts.openshift.io/oauth-redirectreference.mlflow: >-
            {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"mlflow"}}

- name: Pre-create MLflow PostgreSQL service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: mlflow-postgresql
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: "{{ ocp4_workload_mlflow_cluster_release_name }}"
          meta.helm.sh/release-namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"

# -------------------------------------------------------------------
# 3. Grant anyuid SCC to MLflow service account
#    Chart hardcodes runAsUser: 1001 / fsGroup: 1001
# -------------------------------------------------------------------
- name: Grant anyuid SCC to MLflow service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "mlflow-anyuid"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: mlflow
          namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
        - kind: ServiceAccount
          name: mlflow-postgresql
          namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"

# -------------------------------------------------------------------
# 4. Create OAuth proxy cookie secret
# -------------------------------------------------------------------
- name: Create OAuth proxy cookie secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mlflow-proxy-cookie-secret
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
      type: Opaque
      stringData:
        session-secret: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"

# -------------------------------------------------------------------
# 5. Create ClusterRole for OAuth proxy token reviews
# -------------------------------------------------------------------
- name: Create OAuth proxy ClusterRole
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: mlflow-oauth-proxy
      rules:
        - apiGroups: ["authentication.k8s.io"]
          resources: ["tokenreviews"]
          verbs: ["create"]
        - apiGroups: ["authorization.k8s.io"]
          resources: ["subjectaccessreviews"]
          verbs: ["create"]

- name: Create OAuth proxy ClusterRoleBinding
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: mlflow-oauth-proxy
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: mlflow-oauth-proxy
      subjects:
        - kind: ServiceAccount
          name: mlflow
          namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"

# -------------------------------------------------------------------
# 6. Add Helm repo
# -------------------------------------------------------------------
- name: Add community-charts Helm repository
  kubernetes.core.helm_repository:
    name: "{{ ocp4_workload_mlflow_cluster_helm_repo_name }}"
    repo_url: "{{ ocp4_workload_mlflow_cluster_helm_repo_url }}"

# -------------------------------------------------------------------
# 7. Deploy MLflow via Helm (with OAuth proxy sidecar)
# -------------------------------------------------------------------
- name: Deploy MLflow via Helm
  kubernetes.core.helm:
    name: "{{ ocp4_workload_mlflow_cluster_release_name }}"
    chart_ref: "{{ ocp4_workload_mlflow_cluster_helm_repo_name }}/mlflow"
    chart_version: "{{ ocp4_workload_mlflow_cluster_helm_chart_version }}"
    release_namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
    values:
      backendStore:
        databaseConnectionCheck: true
      artifactRoot:
        proxiedArtifactStorage: true
      postgresql:
        enabled: true
        auth:
          username: "{{ ocp4_workload_mlflow_cluster_postgres_user }}"
          password: "{{ ocp4_workload_mlflow_cluster_postgres_password }}"
          database: "{{ ocp4_workload_mlflow_cluster_postgres_database }}"
      serviceAccount:
        create: true
        annotations:
          serviceaccounts.openshift.io/oauth-redirectreference.mlflow: >-
            {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"mlflow"}}
      resources:
        requests:
          cpu: "{{ ocp4_workload_mlflow_cluster_cpu_request }}"
          memory: "{{ ocp4_workload_mlflow_cluster_memory_request }}"
        limits:
          cpu: "{{ ocp4_workload_mlflow_cluster_cpu_limit }}"
          memory: "{{ ocp4_workload_mlflow_cluster_memory_limit }}"
      extraContainers:
        - name: oauth-proxy
          image: "{{ ocp4_workload_mlflow_cluster_oauth_proxy_image }}"
          args:
            - --https-address=:8443
            - --provider=openshift
            - --openshift-service-account=mlflow
            - --upstream=http://localhost:5000
            - --tls-cert=/etc/tls/private/tls.crt
            - --tls-key=/etc/tls/private/tls.key
            - --cookie-secret-file=/etc/proxy/secrets/session-secret
            - --skip-auth-regex=^/health
            - --skip-auth-regex=^/api/
          ports:
            - containerPort: 8443
              name: oauth-proxy
          volumeMounts:
            - name: proxy-tls
              mountPath: /etc/tls/private
              readOnly: true
            - name: proxy-cookie-secret
              mountPath: /etc/proxy/secrets
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      extraVolumes:
        - name: proxy-tls
          secret:
            secretName: mlflow-oauth-tls
        - name: proxy-cookie-secret
          secret:
            secretName: mlflow-proxy-cookie-secret
      serviceMonitor:
        enabled: false
    state: present
    wait: false

# -------------------------------------------------------------------
# 8. Create OAuth proxy Service (serving-cert auto-generates TLS)
# -------------------------------------------------------------------
- name: Create OAuth proxy Service
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: mlflow-oauth
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
        annotations:
          service.beta.openshift.io/serving-cert-secret-name: mlflow-oauth-tls
      spec:
        selector:
          app.kubernetes.io/name: mlflow
          app.kubernetes.io/instance: "{{ ocp4_workload_mlflow_cluster_release_name }}"
        ports:
          - name: oauth-proxy
            port: 443
            targetPort: 8443

# -------------------------------------------------------------------
# 9. Create OpenShift Route (reencrypt via OAuth proxy)
# -------------------------------------------------------------------
- name: Create MLflow route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: mlflow
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
      spec:
        to:
          kind: Service
          name: mlflow-oauth
          weight: 100
        port:
          targetPort: oauth-proxy
        tls:
          termination: reencrypt
          insecureEdgeTerminationPolicy: Redirect

# -------------------------------------------------------------------
# 10. Wait for MLflow deployment to be ready
# -------------------------------------------------------------------
- name: Wait for MLflow deployment to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ocp4_workload_mlflow_cluster_release_name }}"
    namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
  register: r_mlflow_deploy
  retries: "{{ ocp4_workload_mlflow_cluster_deploy_retries }}"
  delay: "{{ ocp4_workload_mlflow_cluster_deploy_retry_delay }}"
  until:
    - r_mlflow_deploy.resources | length > 0
    - r_mlflow_deploy.resources[0].status.readyReplicas is defined
    - r_mlflow_deploy.resources[0].status.readyReplicas >= 1

# -------------------------------------------------------------------
# 11. Discover MLflow route URL
# -------------------------------------------------------------------
- name: Get MLflow route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: mlflow
    namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
  register: r_mlflow_route

- name: Set MLflow URL facts
  ansible.builtin.set_fact:
    _ocp4_workload_mlflow_cluster_url: "https://{{ r_mlflow_route.resources[0].spec.host }}"
    _ocp4_workload_mlflow_cluster_internal_url: "http://{{ ocp4_workload_mlflow_cluster_release_name }}.{{ ocp4_workload_mlflow_cluster_namespace }}.svc.cluster.local"

# -------------------------------------------------------------------
# 12. Verify MLflow API is responsive (health endpoint skips auth)
# -------------------------------------------------------------------
- name: Wait for MLflow API to be responsive
  ansible.builtin.uri:
    url: "{{ _ocp4_workload_mlflow_cluster_url }}/health"
    method: GET
    validate_certs: false
    status_code: 200
  register: r_mlflow_health
  retries: 30
  delay: 10
  until: r_mlflow_health is succeeded

# -------------------------------------------------------------------
# 13. Save connection info
# -------------------------------------------------------------------
- name: Save MLflow connection info
  agnosticd.core.agnosticd_user_info:
    data:
      mlflow_url: "{{ _ocp4_workload_mlflow_cluster_url }}"
      mlflow_internal_url: "{{ _ocp4_workload_mlflow_cluster_internal_url }}"

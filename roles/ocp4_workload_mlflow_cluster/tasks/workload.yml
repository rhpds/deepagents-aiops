---
# ===================================================================
# Deploy shared MLflow tracking server via community Helm chart
# ===================================================================

# -------------------------------------------------------------------
# 1. Create namespace
# -------------------------------------------------------------------
- name: Create MLflow namespace
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ ocp4_workload_mlflow_cluster_namespace }}"

# -------------------------------------------------------------------
# 1b. Create auth configuration ConfigMap
# -------------------------------------------------------------------
- name: Create MLflow auth config
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mlflow-auth-config
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
      data:
        auth_config.ini: |
          [mlflow]
          default_permission = NO_PERMISSIONS
          database_uri = postgresql://{{ ocp4_workload_mlflow_cluster_postgres_user }}:{{ ocp4_workload_mlflow_cluster_postgres_password }}@mlflow-postgresql:5432/{{ ocp4_workload_mlflow_cluster_postgres_database }}
          admin_username = {{ ocp4_workload_mlflow_cluster_admin_username }}
          admin_password = {{ ocp4_workload_mlflow_cluster_admin_password }}
          authorization_function = mlflow.server.auth:authenticate_request_basic_auth

# -------------------------------------------------------------------
# 2. Pre-create service accounts for SCC binding
# -------------------------------------------------------------------
- name: Pre-create MLflow service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: mlflow
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: "{{ ocp4_workload_mlflow_cluster_release_name }}"
          meta.helm.sh/release-namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"

- name: Pre-create MLflow PostgreSQL service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: mlflow-postgresql
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
        labels:
          app.kubernetes.io/managed-by: Helm
        annotations:
          meta.helm.sh/release-name: "{{ ocp4_workload_mlflow_cluster_release_name }}"
          meta.helm.sh/release-namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"

# -------------------------------------------------------------------
# 3. Grant anyuid SCC to MLflow service account
#    Chart hardcodes runAsUser: 1001 / fsGroup: 1001
# -------------------------------------------------------------------
- name: Grant anyuid SCC to MLflow service account
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "mlflow-anyuid"
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: system:openshift:scc:anyuid
      subjects:
        - kind: ServiceAccount
          name: mlflow
          namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
        - kind: ServiceAccount
          name: mlflow-postgresql
          namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"

# -------------------------------------------------------------------
# 4. Add Helm repo
# -------------------------------------------------------------------
- name: Add community-charts Helm repository
  kubernetes.core.helm_repository:
    name: "{{ ocp4_workload_mlflow_cluster_helm_repo_name }}"
    repo_url: "{{ ocp4_workload_mlflow_cluster_helm_repo_url }}"

# -------------------------------------------------------------------
# 5. Deploy MLflow via Helm
# -------------------------------------------------------------------
- name: Deploy MLflow via Helm
  kubernetes.core.helm:
    name: "{{ ocp4_workload_mlflow_cluster_release_name }}"
    chart_ref: "{{ ocp4_workload_mlflow_cluster_helm_repo_name }}/mlflow"
    chart_version: "{{ ocp4_workload_mlflow_cluster_helm_chart_version }}"
    release_namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
    values:
      backendStore:
        databaseConnectionCheck: true
      artifactRoot:
        proxiedArtifactStorage: true
      postgresql:
        enabled: true
        auth:
          username: "{{ ocp4_workload_mlflow_cluster_postgres_user }}"
          password: "{{ ocp4_workload_mlflow_cluster_postgres_password }}"
          database: "{{ ocp4_workload_mlflow_cluster_postgres_database }}"
      resources:
        requests:
          cpu: "{{ ocp4_workload_mlflow_cluster_cpu_request }}"
          memory: "{{ ocp4_workload_mlflow_cluster_memory_request }}"
        limits:
          cpu: "{{ ocp4_workload_mlflow_cluster_cpu_limit }}"
          memory: "{{ ocp4_workload_mlflow_cluster_memory_limit }}"
      extraArgs:
        app-name: basic-auth
      extraEnvVars:
        MLFLOW_SERVER_DISABLE_SECURITY_MIDDLEWARE: "true"
        MLFLOW_AUTH_CONFIG_PATH: /etc/mlflow/auth_config.ini
        MLFLOW_FLASK_SERVER_SECRET_KEY: "{{ ocp4_workload_mlflow_cluster_admin_password }}"
      extraVolumes:
        - name: auth-config
          configMap:
            name: mlflow-auth-config
      extraVolumeMounts:
        - name: auth-config
          mountPath: /etc/mlflow
          readOnly: true
      serviceMonitor:
        enabled: false
    state: present
    wait: false

# -------------------------------------------------------------------
# 6. Create OpenShift Route for MLflow UI
# -------------------------------------------------------------------
- name: Create MLflow route
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: mlflow
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
      spec:
        to:
          kind: Service
          name: "{{ ocp4_workload_mlflow_cluster_release_name }}"
          weight: 100
        port:
          targetPort: http
        tls:
          termination: edge
          insecureEdgeTerminationPolicy: Redirect

# -------------------------------------------------------------------
# 7. Wait for MLflow deployment to be ready
# -------------------------------------------------------------------
- name: Wait for MLflow deployment to be available
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ ocp4_workload_mlflow_cluster_release_name }}"
    namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
  register: r_mlflow_deploy
  retries: "{{ ocp4_workload_mlflow_cluster_deploy_retries }}"
  delay: "{{ ocp4_workload_mlflow_cluster_deploy_retry_delay }}"
  until:
    - r_mlflow_deploy.resources | length > 0
    - r_mlflow_deploy.resources[0].status.readyReplicas is defined
    - r_mlflow_deploy.resources[0].status.readyReplicas >= 1

# -------------------------------------------------------------------
# 8. Discover MLflow route URL
# -------------------------------------------------------------------
- name: Get MLflow route
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    name: mlflow
    namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
  register: r_mlflow_route

- name: Set MLflow URL facts
  ansible.builtin.set_fact:
    _ocp4_workload_mlflow_cluster_url: "https://{{ r_mlflow_route.resources[0].spec.host }}"
    _ocp4_workload_mlflow_cluster_internal_url: "http://{{ ocp4_workload_mlflow_cluster_release_name }}.{{ ocp4_workload_mlflow_cluster_namespace }}.svc.cluster.local"

# -------------------------------------------------------------------
# 9. Verify MLflow API is responsive
# -------------------------------------------------------------------
- name: Wait for MLflow API to be responsive
  ansible.builtin.uri:
    url: "{{ _ocp4_workload_mlflow_cluster_url }}/health"
    method: GET
    validate_certs: false
    status_code: 200
  register: r_mlflow_health
  retries: 30
  delay: 10
  until: r_mlflow_health is succeeded

# -------------------------------------------------------------------
# 9b. Save admin credentials as Secret for tenant roles
# -------------------------------------------------------------------
- name: Create MLflow admin credentials secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: mlflow-admin-credentials
        namespace: "{{ ocp4_workload_mlflow_cluster_namespace }}"
      type: Opaque
      stringData:
        username: "{{ ocp4_workload_mlflow_cluster_admin_username }}"
        password: "{{ ocp4_workload_mlflow_cluster_admin_password }}"

# -------------------------------------------------------------------
# 9c. Verify MLflow auth is operational
# -------------------------------------------------------------------
- name: Verify MLflow basic auth is operational
  ansible.builtin.uri:
    url: "{{ _ocp4_workload_mlflow_cluster_url }}/api/2.0/mlflow/users/get?username={{ ocp4_workload_mlflow_cluster_admin_username }}"
    method: GET
    force_basic_auth: true
    url_username: "{{ ocp4_workload_mlflow_cluster_admin_username }}"
    url_password: "{{ ocp4_workload_mlflow_cluster_admin_password }}"
    validate_certs: false
    status_code: 200
  register: r_mlflow_auth_check
  retries: 30
  delay: 10
  until: r_mlflow_auth_check is succeeded

# -------------------------------------------------------------------
# 10. Save connection info
# -------------------------------------------------------------------
- name: Save MLflow connection info
  agnosticd.core.agnosticd_user_info:
    data:
      mlflow_url: "{{ _ocp4_workload_mlflow_cluster_url }}"
      mlflow_internal_url: "{{ _ocp4_workload_mlflow_cluster_internal_url }}"
      mlflow_admin_username: "{{ ocp4_workload_mlflow_cluster_admin_username }}"
      mlflow_admin_password: "{{ ocp4_workload_mlflow_cluster_admin_password }}"
